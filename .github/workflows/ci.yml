name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust backend build and test
  rust:
    name: Rust Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: randscan
          POSTGRES_PASSWORD: randscan
          POSTGRES_DB: randscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --all
        env:
          DATABASE_URL: postgres://randscan:randscan@localhost:5432/randscan

  # The explorer against a real `rand-node`: tests/real_node.rs spawns the latest fullnode
  # release (node + `rand` wallet) on a one-validator chain, makes a faucet mint, a proved
  # transfer, a deploy and a confidential call (and an RPL-2 invoke where the build has it), and
  # compares the explorer's every public number with the node's — including the REST contract
  # zusd.money and randprotocol.org read (/bridge, /bridge/assets, /tokens/:index, /envelopes,
  # /stats, /supply). It gates: the test skips a sub-check the released binary has no flag for
  # (with a printed reason), never the whole run. The wallet proves under the chain's `test` FRI
  # profile in its own release binary, so the test itself builds in the default profile.
  real-node:
    name: Real node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: randscan
          POSTGRES_PASSWORD: randscan
          POSTGRES_DB: randscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-real-node-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download the fullnode release
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag (e.g. v0.7.1) pins the run to that release; empty means the latest.
          FULLNODE_TAG: ""
        run: |
          mkdir -p "$RUNNER_TEMP/fullnode"
          gh release download $FULLNODE_TAG --repo randprotocol/fullnode \
            --pattern rand-node --pattern rand --pattern SHA256SUMS --dir "$RUNNER_TEMP/fullnode"
          (cd "$RUNNER_TEMP/fullnode" && sha256sum -c --ignore-missing SHA256SUMS)
          chmod +x "$RUNNER_TEMP/fullnode/rand-node" "$RUNNER_TEMP/fullnode/rand"
          "$RUNNER_TEMP/fullnode/rand-node" --version
          echo "RAND_NODE_BIN=$RUNNER_TEMP/fullnode/rand-node" >> "$GITHUB_ENV"
          echo "RAND_CLI=$RUNNER_TEMP/fullnode/rand" >> "$GITHUB_ENV"

      - name: Explorer against the real node
        run: cargo test -p randscan-api --test real_node -- --nocapture
        env:
          DATABASE_URL: postgres://randscan:randscan@localhost:5432/randscan
          RANDSCAN_REQUIRE_REAL_NODE: "1"
          # 1 s blocks: the anchor window is four minutes at 256 blocks (more under the
          # genesis' 1 024-block proof window), room for a shared runner's proving.
          RAND_BLOCK_INTERVAL_MS: "1000"

  # Next.js frontend build
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_WS_URL: ws://localhost:3000

  # The frontend's node:test suite (tests/*.test.mjs). Its own job on Node 22: utils.test.mjs loads
  # TypeScript through Node's type stripping, which Node 20 (the build job's) lacks, and the file
  # skips itself there. Needs nothing from the other jobs.
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  # Docker build test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: randscan-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: randscan-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Line coverage of the Rust workspace, measured with cargo-llvm-cov (LLVM source-based coverage)
  # and uploaded to Codecov, which draws the badge in README.md. Its own job rather than a step of
  # `rust`: that job stops at `cargo fmt --check`, and coverage should not wait on formatting. The
  # same PostgreSQL service and DATABASE_URL as `rust`, because the SQLx tests need them. The upload
  # needs `CODECOV_TOKEN` (an organisation secret on randprotocol, or this repository's); without it
  # the upload step fails. Every `uses:` here is pinned by commit sha, tag in the trailing comment.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: randscan
          POSTGRES_PASSWORD: randscan
          POSTGRES_DB: randscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (branch head, 2026-10-05)
      # llvm-tools for the toolchain the checkout pins (rust-toolchain.toml, where there is one),
      # not for the action's: rustup resolves the toolchain from the working directory.
      - name: llvm-tools for the pinned toolchain
        working-directory: .
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        env:
          DATABASE_URL: postgres://randscan:randscan@localhost:5432/randscan
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
